<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me - Tawan Rutthongchan</title>
  <link rel="stylesheet" href="styles.css">

</head>
<body>

  <div class="container">
    
    <div class="back-link-box">
      <a href="index.html" class="back-link">← กลับหน้าหลัก (Back to Home)</a>
    </div>

    <h2>แบบฟอร์มการติดต่อ (Contact Me)</h2>
    <p class="sub-text">สามารถส่งข้อความ ติดต่องาน หรือสอบถามข้อมูลเพิ่มเติมได้ผ่านฟอร์มด้านล่างนี้</p>

    <form action="#" method="post" class="contact-form">
      <div class="form-group">
        <label for="name">ชื่อ - นามสกุล:</label>
        <input type="text" id="name" name="name" placeholder="กรอกชื่อของคุณ" required>
      </div>

      <div class="form-group">
        <label for="email">อีเมลติดต่อ:</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label for="subject">หัวข้อเรื่อง:</label>
        <input type="text" id="subject" name="subject" placeholder="เรื่องที่ต้องการติดต่อ" required>
      </div>

      <div class="form-group">
        <label for="message">ข้อความ:</label>
        <textarea id="message" name="message" rows="5" placeholder="พิมพ์ข้อความของคุณที่นี่..." required></textarea>
      </div>

      <div class="form-btn-group">
        <button type="submit" class="btn">ส่งข้อความ (Submit)</button>
        <button type="reset" class="btn btn-secondary">ล้างข้อมูล (Reset)</button>
      </div>
    </form>

    <hr class="divider">

    <footer>
      <p>
        <a href="index.html">Home</a> | 
        <a href="https://github.com/TawanRutthongchan6840010911" target="_blank">My GitHub</a>
      </p>
    </footer>

  </div>

</body>
</html>
